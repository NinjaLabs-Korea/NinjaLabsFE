name: Integration (real browser)

# All 15 flows of the FE (api mode) against a real NinjaLabsBE, a private Postgres and headless Chrome.
# Not a required check: meant for manual runs and a nightly sanity pass. See integration/README.md.
#
# The flows are split over parallel jobs (a matrix), each with its own full stack (Postgres, BE, FE, Chrome), so one job
# stays well under its timeout. Flows inside a group run in order; groups must not depend on each other. Dependencies:
# flows 7 and 8 need 4 and 5 (same group). Everything else seeds what it needs or compares before/after (flow 10 seeds the
# builder application and submission that flow 4 would make).
# The full dense layout sweep (NINJA_IT_SWEEP=full, 30+ minutes) is NOT part of this run: use the `sweep_full` input.
on:
  workflow_dispatch:
    inputs:
      be_ref:
        description: NinjaLabsBE branch, tag or SHA to test against
        required: false
        default: main
      sweep_full:
        description: Also run the full dense layout sweep (flow 14 with NINJA_IT_SWEEP=full, 30+ minutes) as its own job
        type: boolean
        required: false
        default: false
  schedule:
    - cron: '17 19 * * *'

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    name: flows ${{ matrix.flows }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: auth-apply, flows: '1 2 3 4 5 7 8' }
          - { name: admin-payout, flows: '6 9 10 11' }
          - { name: community, flows: '12 13' }
          - { name: layout, flows: '14 15' }
    steps:
      - uses: actions/checkout@v5
      # Both repos are public, so no token is needed to check out the BE.
      - uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/NinjaLabsBE
          ref: ${{ inputs.be_ref || 'main' }}
          path: be
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: be
      - name: Locate Postgres and Chrome
        run: |
          PG_BIN="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -n1)"
          test -x "$PG_BIN/initdb" || { echo "no Postgres server binaries under /usr/lib/postgresql"; exit 1; }
          CHROME_PATH="$(command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME_PATH" || { echo "no Chrome on the runner"; exit 1; }
          echo "PG_BIN=$PG_BIN" >> "$GITHUB_ENV"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          echo "postgres: $PG_BIN, chrome: $CHROME_PATH"
      - name: Run the flows (${{ matrix.flows }})
        env:
          NINJA_BE_DIR: ${{ github.workspace }}/be
          # The runner's user namespaces forbid Chrome's sandbox.
          NINJA_IT_CHROME_FLAGS: --no-sandbox --disable-dev-shm-usage
          NINJA_IT_LOG_DIR: ${{ github.workspace }}/integration/.logs/ci
        run: npm run test:integration -- ${{ matrix.flows }}
      - name: Stop leftovers
        if: always()
        run: npm run test:integration -- --reap
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs-${{ matrix.name }}
          path: integration/.logs
          if-no-files-found: ignore

  # Opt-in (workflow_dispatch input sweep_full): every route x state x locale x width, 30+ minutes, its own job.
  sweep-full:
    name: flow 14 full sweep
    if: ${{ inputs.sweep_full }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      # Both repos are public, so no token is needed to check out the BE.
      - uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/NinjaLabsBE
          ref: ${{ inputs.be_ref || 'main' }}
          path: be
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: be
      - name: Locate Postgres and Chrome
        run: |
          PG_BIN="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -n1)"
          test -x "$PG_BIN/initdb" || { echo "no Postgres server binaries under /usr/lib/postgresql"; exit 1; }
          CHROME_PATH="$(command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME_PATH" || { echo "no Chrome on the runner"; exit 1; }
          echo "PG_BIN=$PG_BIN" >> "$GITHUB_ENV"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          echo "postgres: $PG_BIN, chrome: $CHROME_PATH"
      - name: Run the flows (14)
        env:
          NINJA_BE_DIR: ${{ github.workspace }}/be
          # The runner's user namespaces forbid Chrome's sandbox.
          NINJA_IT_SWEEP: full
          NINJA_IT_CHROME_FLAGS: --no-sandbox --disable-dev-shm-usage
          NINJA_IT_LOG_DIR: ${{ github.workspace }}/integration/.logs/ci
        run: npm run test:integration -- 14
      - name: Stop leftovers
        if: always()
        run: npm run test:integration -- --reap
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs-sweep-full
          path: integration/.logs
          if-no-files-found: ignore
