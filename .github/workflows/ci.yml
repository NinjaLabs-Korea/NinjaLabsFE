name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Route types (PageProps/LayoutProps) are generated by Next; vitest does not typecheck.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run test:unit
      # Uses the committed .env.production (API mode), like the deployed build.
      - run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      # Blocking since the 2026-10-24 wagmi 3 upgrade cleared the last production high advisories (AGENTS.md "Stack").
      - name: npm audit (production deps, high+)
        run: npm audit --omit=dev --audit-level=high
