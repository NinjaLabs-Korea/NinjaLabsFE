name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Route types (PageProps/LayoutProps) are generated by Next; vitest does not typecheck.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run test:unit
      # Uses the committed .env.production (API mode), like the deployed build.
      - run: npm run build

  audit:
    name: Dependency audit (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      # Report-only: the job stays green and known advisories surface as a warning annotation.
      # Once the pinned dependencies are upgraded, replace this step with a plain
      # `npm audit --omit=dev --audit-level=high` so new advisories block the PR.
      - name: npm audit (production deps, high+)
        run: |
          if ! npm audit --omit=dev --audit-level=high; then
            echo "::warning title=Dependency audit::Production dependencies have high/critical advisories. See this job's log."
          fi
